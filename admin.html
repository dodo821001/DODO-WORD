<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>DODO WORLD CMS PRO</title>
<link rel="stylesheet" href="assets/admin.css"></head><body>
<header class="top"><div class="topin">
  <div class="brand">DODO WORLD 수정모드 PRO<small>TEXT · IMAGE · STORE · DESIGN MANAGER</small></div>
  <div class="actions">
    <button id="reload" class="s">현재값 불러오기</button>
    <button id="backup" class="s">백업 저장</button>
    <button id="restoreBtn" class="s">백업 불러오기</button>
    <input id="restoreFile" class="file-import" type="file" accept=".json,application/json">
    <button id="preview" class="s">홈페이지 보기</button>
    <button id="save" class="p">GitHub에 저장</button>
  </div>
</div></header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-title">수정 메뉴</div>
    <div id="sideLinks"></div>
  </aside>

  <main class="main">
    <section class="hero">
      <div class="kicker">DODO CMS PRO</div>
      <h1>매장도 계속 추가하고, 글자 색상과 크기까지 직접 바꿀 수 있어요.</h1>
      <p>신규 매장 추가·삭제·순서 변경, 텍스트·사진·링크·매장정보, 섹션 표시/숨김, 대표 컬러와 글자 색상·크기까지 한 화면에서 관리합니다.</p>
      <div class="github">
        <input id="owner" value="dodo821001" placeholder="GitHub 계정명">
        <input id="repo" placeholder="저장소명 예: dodoworld">
        <input id="branch" value="main" placeholder="브랜치">
        <input id="token" type="password" autocomplete="off" placeholder="Fine-grained GitHub Token">
      </div>
    </section>
    <div id="groups" class="groups"></div>
  </main>
</div>

<div id="dirty" class="dirty">저장하지 않은 변경사항이 있습니다</div>
<div id="status" class="status"></div>
<script src="assets/default-content.js"></script>
<script src="assets/admin-schema.js"></script>
<script src="assets/admin.js"></script>
</body></html>
